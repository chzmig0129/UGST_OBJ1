# VALGEOUGST — Production docker-compose
# Usage: docker compose up -d
# Requires a .env file with at minimum: POSTGRES_PASSWORD, SECRET_KEY

version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgis/postgis:16-3.4
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: valgeougst
      POSTGRES_USER: valgeougst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    # NOTE: port 5432 is NOT exposed here intentionally.
    # Use docker-compose.dev.yml override to expose it for local tooling.

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./static:/app/static:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
