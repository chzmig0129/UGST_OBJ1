# =============================================================================
# nginx/nginx-nossl.conf — Initial Nginx config WITHOUT SSL
#
# PURPOSE:
#   Used for the very first deployment before Let's Encrypt certificates exist.
#   Certbot needs a running HTTP server to complete the ACME challenge and issue
#   the certificate.  Once the certificate is obtained, switch to nginx.conf.
#
# WORKFLOW:
#   1. Start services with this config:
#        cp nginx/nginx-nossl.conf nginx/nginx.conf
#        docker-compose up -d nginx
#   2. Obtain certificate:
#        bash scripts/init-letsencrypt.sh DOMAIN
#   3. Switch to the SSL config and reload:
#        cp nginx/nginx.conf.ssl-backup nginx/nginx.conf   # (init-letsencrypt.sh handles this)
#        docker-compose exec nginx nginx -s reload
#
# NOTE: Replace DOMAIN with your actual domain name before use.
# =============================================================================

upstream web {
    server web:8000;
}

# ---------------------------------------------------------------------------
# HTTP only — no redirect, no SSL
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name DOMAIN;

    # ---- Upload / timeout settings (match Flask MAX_CONTENT_LENGTH) ----
    # Users upload large shapefiles — do NOT lower this value.
    client_max_body_size 50M;

    # Match gunicorn timeout for slow shapefile processing operations
    proxy_read_timeout    300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;

    # ---- Gzip compression ----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript;

    # ---- Static files — served directly by Nginx with long-lived cache ----
    location /static/ {
        alias   /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Let's Encrypt / Certbot webroot challenge ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Proxy all other requests to Gunicorn ----
    location / {
        proxy_pass         http://web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}
