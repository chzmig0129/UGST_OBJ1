# =============================================================================
# nginx/nginx.conf — Production Nginx config with SSL (Let's Encrypt)
#
# SETUP INSTRUCTIONS:
#   Replace every occurrence of DOMAIN with your actual domain name, e.g.:
#     sed -i 's/DOMAIN/yourdomain.com/g' nginx/nginx.conf
#
#   This file is used AFTER SSL certificates have been obtained.
#   For the initial deploy (before certs exist) use nginx-nossl.conf instead.
#   See scripts/init-letsencrypt.sh for the automated certificate workflow.
# =============================================================================

upstream web {
    server web:8000;
}

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS, except the ACME challenge path used
# by Certbot to prove domain ownership.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name DOMAIN;

    # Let's Encrypt / Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main production server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name DOMAIN;

    # ---- SSL certificates (managed by Certbot / Let's Encrypt) ----
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # Recommended SSL settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-XSS-Protection          "1; mode=block"                       always;

    # ---- Upload / timeout settings (match Flask MAX_CONTENT_LENGTH) ----
    # Users upload large shapefiles — do NOT lower this value.
    client_max_body_size 50M;

    # Match gunicorn timeout for slow shapefile processing operations
    proxy_read_timeout    300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;

    # ---- Gzip compression ----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript;

    # ---- Static files — served directly by Nginx with long-lived cache ----
    location /static/ {
        alias   /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Certbot webroot challenge (also needed on 443 for renewals) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Proxy all other requests to Gunicorn ----
    location / {
        proxy_pass         http://web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses (e.g. progress endpoints)
        proxy_buffering off;
    }
}
