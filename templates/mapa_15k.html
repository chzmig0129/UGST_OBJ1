{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.fullscreen@2.4.0/Control.FullScreen.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet.fullscreen@2.4.0/Control.FullScreen.js"></script>
<style>
    .viewer-wrap {
        position: relative;
        height: calc(100vh - 110px);
        min-height: 520px;
        display: flex;
        flex-direction: column;
    }
    .viewer-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #e2e2e2;
    }
    .viewer-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #1f2937;
    }
    .viewer-header .meta {
        color: #6b7280;
        font-size: 13px;
    }
    .search-wrap {
        flex: 1;
        position: relative;
        max-width: 520px;
    }
    .search-input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
    }
    .search-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid #d1d5db;
        border-top: none;
        max-height: 360px;
        overflow-y: auto;
        z-index: 2000;
        display: none;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }
    .search-results.open { display: block; }
    .search-result {
        padding: 9px 12px;
        cursor: pointer;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13px;
    }
    .search-result:hover { background: #f3f4f6; }
    .search-result .id { font-weight: 600; color: #111827; }
    .search-result .meta { color: #6b7280; font-size: 11px; }
    .search-empty { padding: 12px; color: #9ca3af; font-size: 13px; text-align: center; }

    #viewer-map { flex: 1; }

    .legend {
        background: #fff;
        padding: 10px 12px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        font-size: 12px;
        line-height: 1.5;
    }
    .legend .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid rgba(0,0,0,0.25);
    }
    .legend-title { font-weight: 600; margin-bottom: 4px; color: #111827; }

    .info-panel {
        position: absolute;
        top: 72px;
        right: 14px;
        background: #fff;
        padding: 12px 14px;
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        font-size: 13px;
        z-index: 1500;
        max-width: 280px;
        display: none;
    }
    .info-panel.visible { display: block; }
    .info-panel h4 { margin: 0 0 6px 0; font-size: 14px; color: #1f2937; }
    .info-panel .row { margin: 2px 0; color: #374151; }
    .info-panel .row b { color: #111827; }

    .status-bar {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(17, 24, 39, 0.88);
        color: #fff;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 1200;
        pointer-events: none;
    }
    .loading-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.92);
        padding: 16px 22px;
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        z-index: 2500;
        display: none;
        font-size: 13px;
        color: #1f2937;
    }
    .loading-spinner.on { display: block; }
</style>
{% endblock %}

{% block content %}
<div class="viewer-wrap">
    <div class="viewer-header">
        <h2>Visor MEGA_CAPA_V3</h2>
        <div class="search-wrap">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Buscar por ID_POLIGONO (ej. 28-5910-00077782-1)"
                autocomplete="off"
            />
            <div id="searchResults" class="search-results"></div>
        </div>
        <div class="meta" id="headerMeta">Busca un polígono para empezar</div>
    </div>
    <div id="viewer-map" style="position: relative;">
        <div id="infoPanel" class="info-panel"></div>
        <div id="statusBar" class="status-bar" style="display:none;"></div>
        <div id="loadingSpinner" class="loading-spinner">Cargando…</div>
    </div>
</div>

<script>
(function() {
    const map = L.map('viewer-map', {
        center: [23.6, -102.5],
        zoom: 5,
        fullscreenControl: true,
    });
    L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        subdomains: ['mt0','mt1','mt2','mt3'],
        maxZoom: 20,
        attribution: '© Google',
    }).addTo(map);

    // Color por fuente
    const colorByFuente = {
        MEGA_CAPA_V2: '#6b7280',
        ERRORES_VINCULACION: '#2563eb',
        REPORTE_TRANSFORMADO: '#10b981',
    };
    const defaultColor = '#9ca3af';
    const targetColor = '#f59e0b'; // amarillo

    // Leyenda
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML =
            '<div class="legend-title">Fuente</div>' +
            '<div><span class="swatch" style="background:#6b7280"></span>MEGA_CAPA_V2</div>' +
            '<div><span class="swatch" style="background:#2563eb"></span>ERRORES_VINCULACION</div>' +
            '<div><span class="swatch" style="background:#10b981"></span>REPORTE_TRANSFORMADO</div>' +
            '<div><span class="swatch" style="background:#f59e0b"></span>Polígono buscado</div>';
        return div;
    };
    legend.addTo(map);

    let radiusLayer = null;
    const infoPanel = document.getElementById('infoPanel');
    const statusBar = document.getElementById('statusBar');
    const spinner = document.getElementById('loadingSpinner');
    const headerMeta = document.getElementById('headerMeta');

    function setStatus(text) {
        if (!text) { statusBar.style.display = 'none'; return; }
        statusBar.textContent = text;
        statusBar.style.display = 'block';
    }
    function setLoading(on) {
        spinner.classList.toggle('on', !!on);
    }

    function styleFor(feature, targetId) {
        const props = feature.properties || {};
        const isTarget = String(props.ID_POLIGON) === String(targetId);
        const color = isTarget ? targetColor : (colorByFuente[props.FUENTE] || defaultColor);
        return {
            color: color,
            weight: isTarget ? 3 : 1.5,
            opacity: 0.95,
            fillColor: color,
            fillOpacity: isTarget ? 0.45 : 0.2,
        };
    }

    function onEachFeature(feature, layer) {
        const p = feature.properties || {};
        layer.on('click', () => showFeatureInfo(p));
        const label = p.ID_POLIGON || '(sin id)';
        layer.bindTooltip(label, { sticky: true });
    }

    function showFeatureInfo(p) {
        infoPanel.innerHTML =
            '<h4>' + (p.ID_POLIGON || '-') + '</h4>' +
            '<div class="row"><b>Crédito:</b> ' + (p.ID_CREDITO || '-') + '</div>' +
            '<div class="row"><b>Fuente:</b> ' + (p.FUENTE || '-') + '</div>';
        infoPanel.classList.add('visible');
    }

    async function loadRadius(id) {
        setLoading(true);
        setStatus('Cargando radio de 1 km…');
        try {
            const r = await fetch('/api/viewer-mega/radius?km=1&id=' + encodeURIComponent(id));
            if (!r.ok) {
                const err = await r.json().catch(() => ({ error: r.statusText }));
                throw new Error(err.error || ('HTTP ' + r.status));
            }
            const data = await r.json();
            if (radiusLayer) {
                map.removeLayer(radiusLayer);
                radiusLayer = null;
            }
            radiusLayer = L.geoJSON(data.geojson, {
                style: (f) => styleFor(f, id),
                onEachFeature: onEachFeature,
            }).addTo(map);
            try {
                map.fitBounds(radiusLayer.getBounds(), { padding: [30, 30] });
            } catch (e) {
                if (data.target_centroid) {
                    map.setView([data.target_centroid.lat, data.target_centroid.lng], 16);
                }
            }
            headerMeta.textContent = data.total + ' polígono(s) en 1 km alrededor de ' + id;
            // Abrir info del target automáticamente
            const targetFeature = data.geojson.features.find(
                f => String(f.properties.ID_POLIGON) === String(id)
            );
            if (targetFeature) showFeatureInfo(targetFeature.properties);
            setStatus('');
        } catch (e) {
            setStatus('Error: ' + e.message);
            console.error(e);
        } finally {
            setLoading(false);
        }
    }

    // Search with debounce
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchTimer = null;

    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const q = searchInput.value.trim();
        if (q.length < 2) {
            searchResults.classList.remove('open');
            searchResults.innerHTML = '';
            return;
        }
        searchTimer = setTimeout(() => runSearch(q), 220);
    });

    async function runSearch(q) {
        try {
            const r = await fetch('/api/viewer-mega/search?q=' + encodeURIComponent(q));
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            const items = data.results || [];
            if (items.length === 0) {
                searchResults.innerHTML = '<div class="search-empty">Sin resultados</div>';
                searchResults.classList.add('open');
                return;
            }
            const totalTxt = (data.total_matches && data.total_matches > items.length)
                ? ' <span class="meta">(' + items.length + ' de ' + data.total_matches + ')</span>'
                : '';
            searchResults.innerHTML = items.map(it =>
                '<div class="search-result" data-id="' + it.id_poligon + '">' +
                '  <div class="id">' + it.id_poligon + '</div>' +
                '  <div class="meta">Crédito: ' + (it.id_credito || '-') + ' · Fuente: ' + (it.fuente || '-') + '</div>' +
                '</div>'
            ).join('') + (totalTxt ? '<div class="search-empty">' + totalTxt + '</div>' : '');
            searchResults.classList.add('open');
            searchResults.querySelectorAll('.search-result').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.getAttribute('data-id');
                    searchInput.value = id;
                    searchResults.classList.remove('open');
                    loadRadius(id);
                });
            });
        } catch (e) {
            console.error(e);
            searchResults.innerHTML = '<div class="search-empty">Error al buscar</div>';
            searchResults.classList.add('open');
        }
    }

    searchInput.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
            ev.preventDefault();
            const q = searchInput.value.trim();
            if (q.length > 0) {
                // Si hay primer resultado, cargarlo
                const first = searchResults.querySelector('.search-result');
                if (first) {
                    const id = first.getAttribute('data-id');
                    searchInput.value = id;
                    searchResults.classList.remove('open');
                    loadRadius(id);
                } else {
                    // intentar directo
                    loadRadius(q);
                }
            }
        } else if (ev.key === 'Escape') {
            searchResults.classList.remove('open');
        }
    });

    document.addEventListener('click', (ev) => {
        if (!ev.target.closest('.search-wrap')) {
            searchResults.classList.remove('open');
        }
    });
})();
</script>
{% endblock %}
