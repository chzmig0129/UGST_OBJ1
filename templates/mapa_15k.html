{% extends 'base.html' %}

{% block head %}
<!-- Leaflet Fullscreen Plugin -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.fullscreen@2.4.0/Control.FullScreen.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet.fullscreen@2.4.0/Control.FullScreen.js"></script>

<style>
    /* Custom tooltip for 15K map */
    .custom-tooltip-15k {
        background: rgba(0, 0, 0, 0.8) !important;
        color: white !important;
        border: none !important;
        border-radius: 4px !important;
        padding: 6px 10px !important;
        font-size: 12px !important;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4) !important;
    }
    .custom-tooltip-15k::before {
        border-color: transparent !important;
    }

    /* Loading overlay */
    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.7);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
    }

    /* Map container */
    #map {
        width: 100%;
        border-radius: 8px;
    }

    /* Layer control panel */
    #layer-control-panel {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 1000;
        min-width: 220px;
    }

    /* Map wrapper needs relative positioning for overlay and panel */
    #map-wrapper {
        position: relative;
    }

    /* Header badge */
    .polygon-badge {
        font-size: 0.85rem;
        padding: 0.4em 0.75em;
    }

    /* Fullscreen button styling */
    .leaflet-control-fullscreen a {
        background-color: #fff;
        border-radius: 4px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
    }
    .leaflet-control-fullscreen a:hover {
        background-color: #f4f4f4;
        transform: scale(1.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="p-3" style="height: 100%; display: flex; flex-direction: column;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center gap-3">
            <div class="app-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
                    <circle cx="12" cy="10" r="3"></circle>
                    <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"></path>
                </svg>
            </div>
            <div>
                <h1 class="mb-0 h4">Mapa de Polígonos 15K</h1>
                <p class="text-muted mb-0 small">Visualización masiva de polígonos de validación e histórico</p>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-secondary polygon-badge" id="polygon-count-badge">
                <i class="bi bi-hourglass-split me-1"></i>Cargando...
            </span>
        </div>
    </div>

    <!-- Filter panel -->
    <div class="filter-panel p-3 mb-2" style="background: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6;">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-bold" style="font-size: 13px;">Estado</label>
                <select id="filtro-estado" class="form-select form-select-sm">
                    <option value="">Todos los estados</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold" style="font-size: 13px;">Municipio</label>
                <select id="filtro-municipio" class="form-select form-select-sm" disabled>
                    <option value="">Seleccione estado primero</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold" style="font-size: 13px;">ID Crédito</label>
                <input type="text" id="filtro-id-credito" class="form-control form-control-sm" placeholder="Buscar...">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold" style="font-size: 13px;">ID Polígono</label>
                <input type="text" id="filtro-id-poligono" class="form-control form-control-sm" placeholder="Buscar...">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button id="btn-aplicar-filtros" class="btn btn-sm btn-primary flex-grow-1">
                    <i class="bi bi-funnel"></i> Filtrar
                </button>
                <button id="btn-limpiar-filtros" class="btn btn-sm btn-outline-secondary flex-grow-1">
                    <i class="bi bi-x-circle"></i> Limpiar
                </button>
            </div>
        </div>
    </div>

    <!-- Map wrapper -->
    <div id="map-wrapper" style="flex: 1; position: relative;">

        <!-- Loading overlay (shown while fetching) -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="text-center">
                <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <div class="mt-3 fw-semibold text-secondary" id="loading-message">Cargando polígonos...</div>
            </div>
        </div>

        <!-- Map -->
        <div id="map" style="height: calc(100vh - 120px);"></div>

        <!-- Layer control panel (floating, bottom-left) -->
        <div id="layer-control-panel">
            <div class="card shadow-sm">
                <div class="card-header py-2 d-flex align-items-center gap-2">
                    <i class="bi bi-layers"></i>
                    <span class="fw-semibold small">Control de Capas</span>
                </div>
                <div class="card-body py-2 px-3">
                    <!-- Validación toggle -->
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="toggleValidacion" checked>
                        <label class="form-check-label small" for="toggleValidacion">
                            <span style="color: #4CE600; font-weight: bold;">&#9632;</span>
                            Validación (15K)
                        </label>
                    </div>
                    <!-- Histórico toggle -->
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="toggleHistorico" checked>
                        <label class="form-check-label small" for="toggleHistorico">
                            <span style="color: #ff8c00; font-weight: bold;">&#9632;</span>
                            Histórico (57K)
                        </label>
                    </div>
                    <!-- Polygon counter -->
                    <hr class="my-2">
                    <div class="text-muted small text-center" id="layer-counter">
                        <i class="bi bi-hourglass-split me-1"></i>Cargando...
                    </div>
                </div>
            </div>
        </div>

    </div><!-- /#map-wrapper -->

</div><!-- /.p-3 -->

<script>
(function () {
    'use strict';

    // ── Layer references ──────────────────────────────────────────────────────
    var validacionLayer = null;
    var historicoLayer  = null;
    var totalLoaded     = 0;
    var layersReady     = 0;   // increments to 2 when both fetches complete

    // ── Styles ────────────────────────────────────────────────────────────────
    var STYLE_VALIDACION = {
        color:       '#00734C',
        fillColor:   '#4CE600',
        weight:      1,
        fillOpacity: 0.3
    };

    var STYLE_HISTORICO = {
        color:       '#cc7000',
        fillColor:   '#ff8c00',
        weight:      1,
        fillOpacity: 0.2
    };

    // ── Map initialisation ────────────────────────────────────────────────────
    var map = L.map('map', {
        center: [24.0, -102.0],
        zoom: 6,
        preferCanvas: true,          // CRITICAL for 70K+ polygons
        fullscreenControl: true,
        fullscreenControlOptions: {
            position: 'topleft',
            title: 'Pantalla Completa',
            titleCancel: 'Salir de Pantalla Completa'
        }
    });

    // ── Base layers ───────────────────────────────────────────────────────────
    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
    });

    var esriLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri',
        maxZoom: 18
    });

    var cartoLayer = L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 19
    });

    // Default base layer: Esri World Imagery (same as Validar module)
    esriLayer.addTo(map);

    // Layer control for base maps
    L.control.layers({
        'OpenStreetMap':      osmLayer,
        'Esri World Imagery': esriLayer,
        'CartoDB Dark':       cartoLayer
    }, {}).addTo(map);

    // ── Helpers ───────────────────────────────────────────────────────────────
    function safeVal(val) {
        return (val !== null && val !== undefined && val !== '') ? val : 'N/A';
    }

    function updateCounters(total) {
        var text = total.toLocaleString('es-MX') + ' polígonos cargados';
        document.getElementById('layer-counter').innerHTML =
            '<i class="bi bi-check-circle-fill text-success me-1"></i>' + text;
        document.getElementById('polygon-count-badge').innerHTML =
            '<i class="bi bi-geo-alt-fill me-1"></i>' + text;
        document.getElementById('polygon-count-badge').className =
            'badge bg-success polygon-badge';
    }

    function showLoadingOverlay() {
        var overlay = document.getElementById('loading-overlay');
        if (overlay) {
            overlay.style.display = 'flex';
        }
    }

    function hideLoadingOverlay() {
        var overlay = document.getElementById('loading-overlay');
        if (overlay) {
            overlay.style.display = 'none';
        }
    }

    function onLayerReady() {
        layersReady += 1;
        if (layersReady >= 2) {
            hideLoadingOverlay();
            updateCounters(totalLoaded);
        }
    }

    function updateLoadingMessage(msg) {
        var el = document.getElementById('loading-message');
        if (el) el.textContent = msg;
    }

    // ── onEachFeature factories ───────────────────────────────────────────────
    function makeOnEachFeature(includeNombreZip, originalStyle) {
        return function (feature, layer) {
            var props = feature.properties || {};
            var estado     = safeVal(props.ESTADO);
            var municipio  = safeVal(props.MUNICIPIO);
            var idPoligon  = safeVal(props.ID_POLIGON);
            var idCredito  = safeVal(props.ID_CREDITO);

            var tooltipHtml =
                '<b>Estado:</b> '     + estado    + '<br>' +
                '<b>Municipio:</b> '  + municipio + '<br>' +
                '<b>ID Polígono:</b> ' + idPoligon + '<br>' +
                '<b>ID Crédito:</b> '  + idCredito;

            if (includeNombreZip) {
                var nombreZip = safeVal(props.NOMBRE_ZIP);
                tooltipHtml += '<br><b>Archivo:</b> ' + nombreZip;
            }

            layer.bindTooltip(tooltipHtml, {
                permanent:  false,
                direction:  'auto',
                opacity:    0.9,
                className:  'custom-tooltip-15k'
            });

            // Hover effects
            layer.on('mouseover', function () {
                layer.setStyle({ weight: 3, fillOpacity: 0.6 });
            });
            layer.on('mouseout', function () {
                layer.setStyle(originalStyle);
            });
        };
    }

    // ── Reusable layer creation functions ─────────────────────────────────────
    function crearCapaValidacion(geojsonData) {
        var layer = L.geoJSON(geojsonData, {
            style: STYLE_VALIDACION,
            onEachFeature: makeOnEachFeature(true, STYLE_VALIDACION)
        });
        return layer;
    }

    function crearCapaHistorico(geojsonData) {
        var layer = L.geoJSON(geojsonData, {
            style: STYLE_HISTORICO,
            onEachFeature: makeOnEachFeature(false, STYLE_HISTORICO)
        });
        return layer;
    }

    // ── Build query string from active filters ────────────────────────────────
    function buildQueryString() {
        var params = [];
        var estado     = document.getElementById('filtro-estado').value;
        var municipio  = document.getElementById('filtro-municipio').value;
        var idCredito  = document.getElementById('filtro-id-credito').value.trim();
        var idPoligono = document.getElementById('filtro-id-poligono').value.trim();

        if (estado)     params.push('estado='     + encodeURIComponent(estado));
        if (municipio)  params.push('municipio='  + encodeURIComponent(municipio));
        if (idCredito)  params.push('id_credito=' + encodeURIComponent(idCredito));
        if (idPoligono) params.push('id_poligono='+ encodeURIComponent(idPoligono));

        return params.length ? '?' + params.join('&') : '';
    }

    // ── Reload both layers with current filter params ─────────────────────────
    function recargarCapas() {
        var qs = buildQueryString();

        // Show loading overlay
        showLoadingOverlay();
        updateLoadingMessage('Aplicando filtros...');

        // Clear existing layers from map
        if (validacionLayer) {
            validacionLayer.clearLayers();
            map.removeLayer(validacionLayer);
            validacionLayer = null;
        }
        if (historicoLayer) {
            historicoLayer.clearLayers();
            map.removeLayer(historicoLayer);
            historicoLayer = null;
        }

        // Reset counters
        totalLoaded = 0;
        layersReady = 0;

        var allBounds = [];

        // Fetch validación
        updateLoadingMessage('Cargando capa de validación (15K)...');
        fetchWithRetry('/api/mapa-15k/validacion' + qs)
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('Error HTTP ' + response.status + ' al cargar validación');
                }
                return response.json();
            })
            .then(function (data) {
                var geojson = data.geojson;
                var total   = data.total || 0;
                totalLoaded += total;

                validacionLayer = crearCapaValidacion(geojson);

                // Add to map only if toggle is checked
                if (document.getElementById('toggleValidacion').checked) {
                    validacionLayer.addTo(map);
                }

                // Collect bounds
                if (validacionLayer.getLayers().length > 0) {
                    try {
                        allBounds.push(validacionLayer.getBounds());
                    } catch (e) { /* ignore */ }
                }

                updateLoadingMessage('Cargando capa histórica (57K)...');
                onLayerReadyRecargar(allBounds);
            })
            .catch(function (err) {
                console.error('Error cargando capa validación:', err);
                onLayerReadyRecargar(allBounds);
            });

        // Fetch histórico
        fetchWithRetry('/api/mapa-15k/historico' + qs)
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('Error HTTP ' + response.status + ' al cargar histórico');
                }
                return response.json();
            })
            .then(function (data) {
                var geojson = data.geojson;
                var total   = data.total || 0;
                totalLoaded += total;

                historicoLayer = crearCapaHistorico(geojson);

                // Add to map only if toggle is checked
                if (document.getElementById('toggleHistorico').checked) {
                    historicoLayer.addTo(map);
                }

                // Collect bounds
                if (historicoLayer.getLayers().length > 0) {
                    try {
                        allBounds.push(historicoLayer.getBounds());
                    } catch (e) { /* ignore */ }
                }

                onLayerReadyRecargar(allBounds);
            })
            .catch(function (err) {
                console.error('Error cargando capa histórico:', err);
                onLayerReadyRecargar(allBounds);
            });
    }

    // Helper: called when each layer finishes loading during recargarCapas
    function onLayerReadyRecargar(allBounds) {
        layersReady += 1;
        if (layersReady >= 2) {
            hideLoadingOverlay();
            updateCounters(totalLoaded);

            // fitBounds to combined results
            if (allBounds.length > 0) {
                try {
                    var combined = allBounds[0];
                    for (var i = 1; i < allBounds.length; i++) {
                        combined = combined.extend(allBounds[i]);
                    }
                    map.fitBounds(combined, { padding: [20, 20] });
                } catch (e) { /* ignore if bounds invalid */ }
            }
        }
    }

    // ── Initial load ──────────────────────────────────────────────────────────
    updateLoadingMessage('Cargando capa de validación (15K)...');

    fetchWithRetry('/api/mapa-15k/validacion')
        .then(function (response) {
            if (!response.ok) {
                throw new Error('Error HTTP ' + response.status + ' al cargar validación');
            }
            return response.json();
        })
        .then(function (data) {
            var geojson = data.geojson;
            var total   = data.total || 0;
            totalLoaded += total;

            validacionLayer = crearCapaValidacion(geojson);
            validacionLayer.addTo(map);

            updateLoadingMessage('Cargando capa histórica (57K)...');
            onLayerReady();
        })
        .catch(function (err) {
            console.error('Error cargando capa validación:', err);
            alert('Error al cargar la capa de validación: ' + err.message);
            onLayerReady(); // still unblock the UI
        });

    fetchWithRetry('/api/mapa-15k/historico')
        .then(function (response) {
            if (!response.ok) {
                throw new Error('Error HTTP ' + response.status + ' al cargar histórico');
            }
            return response.json();
        })
        .then(function (data) {
            var geojson = data.geojson;
            var total   = data.total || 0;
            totalLoaded += total;

            historicoLayer = crearCapaHistorico(geojson);
            historicoLayer.addTo(map);

            onLayerReady();
        })
        .catch(function (err) {
            console.error('Error cargando capa histórico:', err);
            alert('Error al cargar la capa histórica: ' + err.message);
            onLayerReady(); // still unblock the UI
        });

    // ── Layer toggle controls ─────────────────────────────────────────────────
    document.getElementById('toggleValidacion').addEventListener('change', function () {
        if (!validacionLayer) return;
        if (this.checked) {
            map.addLayer(validacionLayer);
        } else {
            map.removeLayer(validacionLayer);
        }
    });

    document.getElementById('toggleHistorico').addEventListener('change', function () {
        if (!historicoLayer) return;
        if (this.checked) {
            map.addLayer(historicoLayer);
        } else {
            map.removeLayer(historicoLayer);
        }
    });

    // ── Filter: load estados on DOMContentLoaded ──────────────────────────────
    fetchWithRetry('/api/mapa-15k/estados')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            var select = document.getElementById('filtro-estado');
            data.estados.forEach(function (e) {
                var opt = document.createElement('option');
                opt.value = e.name;
                opt.textContent = e.name + ' (' + e.count + ')';
                select.appendChild(opt);
            });
            // Guardar municipios_por_estado para uso posterior
            window._municipiosPorEstado = data.municipios_por_estado || {};
        })
        .catch(function (err) { console.error('Error cargando estados:', err); });

    // ── Filter: estado change → populate municipios ───────────────────────────
    document.getElementById('filtro-estado').addEventListener('change', function () {
        var munSelect = document.getElementById('filtro-municipio');
        munSelect.innerHTML = '<option value="">Todos los municipios</option>';
        if (this.value && window._municipiosPorEstado && window._municipiosPorEstado[this.value]) {
            munSelect.disabled = false;
            window._municipiosPorEstado[this.value].forEach(function (m) {
                var opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                munSelect.appendChild(opt);
            });
        } else {
            munSelect.disabled = !this.value;
            if (!this.value) munSelect.innerHTML = '<option value="">Seleccione estado primero</option>';
        }
    });

    // ── Filter: Filtrar button ────────────────────────────────────────────────
    document.getElementById('btn-aplicar-filtros').addEventListener('click', function () {
        recargarCapas();
    });

    // ── Filter: Limpiar button ────────────────────────────────────────────────
    document.getElementById('btn-limpiar-filtros').addEventListener('click', function () {
        document.getElementById('filtro-estado').value = '';
        document.getElementById('filtro-municipio').value = '';
        document.getElementById('filtro-municipio').disabled = true;
        document.getElementById('filtro-municipio').innerHTML = '<option value="">Seleccione estado primero</option>';
        document.getElementById('filtro-id-credito').value = '';
        document.getElementById('filtro-id-poligono').value = '';
        recargarCapas();
    });

}());
</script>
{% endblock %}
